<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" c>
  <title>Apex WMS — Warehouse Inventory & Order Management System</title>
  
  <!-- Standardized Icon Library: Phosphor Icons (Local Offline + CDN Fallback) -->
  <link rel="stylesheet" href="css/phosphor/regular.css">
  <link rel="stylesheet" href="css/phosphor/bold.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/bold/style.css">

  <!-- Presentation Layer (Separation of Concerns) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ====================================================================
       MODULE 1: LOGIN & USER MANAGEMENT VIEW
       ==================================================================== -->
  <div id="view-login" class="view-container active">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <div class="brand-icon" style="margin: 0 auto var(--space-3); width: 48px; height: 48px; font-size: 24px;">
          <i class="ph-bold ph-warehouse"></i>
        </div>
        <h2>Apex Logistics WMS</h2>
        <p style="font-size: var(--font-size-sm); margin-top: 4px;">Warehouse Inventory & Order Management System</p>
      </div>

      <div id="login-error-msg" class="badge badge-out-of-stock" style="display: none; width: 100%; margin-bottom: var(--space-4); justify-content: center; padding: 8px;">
        <!-- Dynamic Error Feedback (Rule #3 & #5) -->
      </div>

      <form id="form-login" novalidate action="dashboard.html">
        <div class="form-group">
          <label class="form-label required" for="login-email">Email or Operator ID</label>
          <input type="text" id="login-email" class="form-control" placeholder="e.g. m.vance@apexlogistics.io" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label required" for="login-password">Password</label>
            <span style="font-size: var(--font-size-xs); color: var(--color-text-muted);">Min 4 chars</span>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-5);">
          <label style="display: flex; align-items: center; gap: 8px; font-size: var(--font-size-xs); cursor: pointer;">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember terminal device</span>
          </label>
          <button type="button" class="btn btn-outline btn-sm" id="btn-demo-login">Auto-fill Demo</button>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          <i class="ph-bold ph-sign-in" style="margin-right: 6px;"></i> Sign In to Terminal
        </button>
      </form>

      
    </div>

</body>
</html>
